# Purpose: production + preview Services. Production points at slot: green; preview always points at green.
# Apply:   kubectl apply -f manifests/bluegreen/services.yaml
# To switch production, change the 'slot:' value in the first two Services and re-apply.
apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230151
spec:
  type: ClusterIP                       # internal production address used by the monitor
  selector:
    app: notice-board
    slot: green                         # THE SWITCH: which colour receives production traffic
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-ext
  namespace: nb-02230151
spec:
  type: NodePort
  selector:
    app: notice-board
    slot: green                         # THE SWITCH: must always match the Service above
  ports:
    - port: 80
      targetPort: http
      nodePort: 30090                   # lab-mandated external port
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-preview
  namespace: nb-02230151
spec:
  type: ClusterIP                       # internal only, for testing green before it goes live
  selector:
    app: notice-board
    slot: green                         # always green, never switched
  ports:
    - port: 80
      targetPort: http