# Purpose: ClusterIP and NodePort Services for notice-board.
# Apply:   kubectl apply -f manifests/rolling/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230151
spec:
  type: ClusterIP                       # internal only; the monitor calls http://notice-board
  selector:
    app: notice-board                   # no version label, so every version is included
  ports:
    - port: 80                          # lab-mandated service port
      targetPort: http                  # named container port
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-ext
  namespace: nb-02230151
spec:
  type: NodePort
  selector:
    app: notice-board
  ports:
    - port: 80
      targetPort: http
      nodePort: 30090                   # lab-mandated; kind maps host 127.0.0.1:30090 to this