
# Purpose: Configure the CTE412 Practical 15 Kubernetes cluster.
# Apply command:
# kind create cluster --name cte412-02230151 --config cluster/kind-cluster.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  # The control-plane node manages the cluster.
  - role: control-plane
    extraPortMappings:
      # Expose the application on localhost port 30090.
      - containerPort: 30090
        hostPort: 30090
        listenAddress: "127.0.0.1"
        protocol: TCP

  # First worker node for application workloads.
  - role: worker

  # Second worker node for application workloads.
  - role: worker
